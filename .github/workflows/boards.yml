name: Board Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [stm32wb55xx_nucleo, stm32wba55cg_nucleo, stm32wb09ke_nucleo, pic32cz_curiosity_ultra, stm32h563zi_nucleo, stm32f411_blackpill, stm32c031_nucleo, stm32f091rc_nucleo, stm32f302r8_nucleo, stm32l152re_nucleo, stm32n657a0_nucleo, stm32u5a5zj_nucleo]
        extra_cflags: ["", "-DWHAL_CFG_NO_TIMEOUT"]
        include:
          - board: stm32wb55xx_nucleo
            extra_cflags: "-DBOARD_DMA"
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build blinky
        working-directory: examples/blinky
        run: CFLAGS="${{ matrix.extra_cflags }}" make BOARD=${{ matrix.board }}

      - name: Build tests
        working-directory: tests
        run: CFLAGS="${{ matrix.extra_cflags }}" make BOARD=${{ matrix.board }}
